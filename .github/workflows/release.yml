name: Release

on:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # global.json pins a .NET 11 preview SDK
          include-prerelease: true
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Pack and publish
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The release's own tag, with or without a leading "v" (1.2.0 and v1.2.0 both work).
          # git describe --match "v*" ignored tags without the "v" and re-packed the last v-tag.
          VERSION="${RELEASE_TAG#v}"
          dotnet pack src/EnfusionCodegen.Cli/EnfusionCodegen.Cli.csproj --configuration Release --output ./out -p:Version=$VERSION
          dotnet nuget push "./out/*.$VERSION.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}"
      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./out/*
